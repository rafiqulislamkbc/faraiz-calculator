name: Build Android and Desktop Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Create Platform Files if missing
        run: flutter create --platforms=android .

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Faraiz-Calculator-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Create Windows Platform Files
        run: flutter create --platforms=windows .

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Archive Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Faraiz_Calculator_Windows.zip

      - name: Upload Windows App Zip
        uses: actions/upload-artifact@v4
        with:
          name: Faraiz-Calculator-Windows-Desktop
          path: Faraiz_Calculator_Windows.zip